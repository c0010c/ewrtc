name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    env:
      CC: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake pkg-config libssl-dev libsrtp2-dev
      - name: Check documentation
        run: python3 tests/check_docs.py
      - name: Configure
        run: cmake --preset default -DEWRTC_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build --preset default --parallel 2
      - name: Test
        run: ctest --preset default
      - name: Verify installed API boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, 'tests')
          from verify_builds import check_package
          check_package(Path('build-default').resolve(), Path('build-default').resolve(),
                        ['session', 'ewrtc', 'pal_linux'], session=True, linux=True)
          PY
      - name: Run standalone example
        run: |
          cmake --install build-default --prefix "$RUNNER_TEMP/ewrtc-install"
          cmake -S examples/minimal -B build-minimal -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/ewrtc-install"
          cmake --build build-minimal --parallel 2
          ./build-minimal/ewrtc_minimal
