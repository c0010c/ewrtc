name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    env:
      CC: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Initialize Mbed TLS framework
        run: git submodule update --init --recursive --depth 1 third_party/mbedtls
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake pkg-config perl python3
      - name: Build pinned dependencies
        run: |
          JOBS=2 bash tools/build_dependencies.sh "$RUNNER_TEMP/ewrtc-deps" openssl libsrtp mbedtls opus
          echo "OPENSSL_ROOT_DIR=$RUNNER_TEMP/ewrtc-deps" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$RUNNER_TEMP/ewrtc-deps/lib/pkgconfig" >> "$GITHUB_ENV"
      - name: Check documentation
        run: python3 tests/check_docs.py
      - name: Check dependency source handling
        run: python3 tests/check_dependencies.py
      - name: Configure
        run: cmake --preset default -DEWRTC_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build --preset default --parallel 2
      - name: Test
        run: ctest --preset default
      - name: Verify all backends, components and installed consumers
        run: python3 tests/verify_builds.py --output build-matrix
      - name: Verify dependency sources stayed clean
        run: |
          git diff --exit-code --submodule=diff
          git submodule foreach --recursive 'test -z "$(git status --porcelain)"'
      - name: Run standalone example
        run: |
          cmake --install build-default --prefix "$RUNNER_TEMP/ewrtc-install"
          cmake -S examples/minimal -B build-minimal -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/ewrtc-install"
          cmake --build build-minimal --parallel 2
          ./build-minimal/ewrtc_minimal
